name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      server_json:
        description: "Path to the server.json to publish"
        required: false
        default: ".registry/io.github.contextstream-mcp.server.json"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher

      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish "${{ inputs.server_json || '.registry/io.github.contextstream-mcp.server.json' }}"
