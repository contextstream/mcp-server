name: MCP Registry status

on:
  workflow_dispatch:
    inputs:
      server_name:
        description: "Full server name (e.g. io.github.contextstream/mcp)"
        required: true
      status:
        description: "New status: active | deprecated | deleted"
        required: true
      version:
        description: "Version (leave empty when all_versions is true)"
        required: false
        default: ""
      all_versions:
        description: "Apply to all versions (true/false)"
        required: false
        default: "true"
      message:
        description: "Optional message explaining the status change"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher

      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Update status
        run: |
          ARGS=(--status "${{ inputs.status }}")
          if [ -n "${{ inputs.message }}" ]; then ARGS+=(--message "${{ inputs.message }}"); fi
          if [ "${{ inputs.all_versions }}" = "true" ]; then ARGS+=(--all-versions); fi
          echo y | ./mcp-publisher status "${ARGS[@]}" "${{ inputs.server_name }}" ${{ inputs.version }}
