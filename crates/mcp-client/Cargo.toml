[package]
name = "mcp-client"
description = "HTTP client for ContextStream API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mcp-types = { workspace = true }
reqwest = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
regex-lite = { workspace = true }
base64 = "0.23"
urlencoding = "2.1.3"
dirs = "7.0"
sha2 = "0.11"
hex = "0.4"
ignore = { workspace = true }
flate2 = "1"
regex = "1"
tempfile = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
openssl-probe = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The local TLS server of tests/tls_trust_roots.rs. Already in the tree through
# reqwest, with the same crypto provider (ring).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
